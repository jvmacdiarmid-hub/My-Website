name: Auto-merge Claude branches into master

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR and merge into master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CLAUDE_BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Processing branch: $CLAUDE_BRANCH"

          # Check if a PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "$CLAUDE_BRANCH" --base master --json number -q '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists"
            PR_NUM="$EXISTING_PR"
          else
            PR_NUM=$(gh pr create \
              --base master \
              --head "$CLAUDE_BRANCH" \
              --title "Merge $CLAUDE_BRANCH into master" \
              --body "Automated merge of $CLAUDE_BRANCH into master." \
              --json number -q '.number')
            echo "Created PR #$PR_NUM"
          fi

          # Merge the PR
          gh pr merge "$PR_NUM" --merge
