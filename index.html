<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Review Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #f8f9fc;
            --bg-card: #ffffff;
            --bg-elevated: #ffffff;
            --text-primary: #1a1d26;
            --text-secondary: #5a6072;
            --text-muted: #8b90a0;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #eef2ff;
            --accent-subtle: #e0e7ff;
            --border: #e8eaef;
            --border-light: #f1f2f6;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.04), 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.06), 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Header --- */
        header {
            background: linear-gradient(135deg, #312e81 0%, #4338ca 40%, #6366f1 100%);
            color: #fff;
            padding: 3rem 1.5rem 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.06) 0%, transparent 40%);
            pointer-events: none;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        }

        header h1 {
            font-size: 2.25rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
            position: relative;
        }

        header p {
            font-size: 1.05rem;
            opacity: 0.75;
            font-weight: 400;
            position: relative;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* --- API key bar --- */
        .api-key-bar {
            max-width: 680px;
            margin: -1.25rem auto 0;
            padding: 0 1rem;
            position: relative;
            z-index: 10;
        }

        .api-key-inner {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 14px;
            box-shadow: var(--shadow-md);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .api-key-inner:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-md), 0 0 0 3px var(--accent-light);
        }

        .api-key-inner label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .api-key-inner input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 0.88rem;
            padding: 0.4rem 0.5rem;
            background: transparent;
            color: var(--text-primary);
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        }

        .api-key-inner input::placeholder { color: var(--text-muted); }

        .api-key-inner .key-status {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            white-space: nowrap;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .api-key-inner .key-status.saved {
            background: var(--success-light);
            color: var(--success);
        }

        .api-key-inner .key-status.missing {
            background: var(--danger-light);
            color: var(--danger);
        }

        .api-key-help {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .api-key-help a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .api-key-help a:hover { text-decoration: underline; }

        /* --- Search --- */
        .search-container {
            max-width: 680px;
            margin: 1.5rem auto 2rem;
            padding: 0 1rem;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 6px 6px 6px 18px;
            box-shadow: var(--shadow-lg);
            transition: border-color 0.2s, box-shadow 0.3s, transform 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--accent);
            box-shadow: var(--shadow-xl), 0 0 0 4px var(--accent-light);
            transform: translateY(-1px);
        }

        .search-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .search-box:focus-within .search-icon { color: var(--accent); }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 1.05rem;
            padding: 0.75rem 0.75rem;
            border-radius: var(--radius-md);
            background: transparent;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-box button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.01em;
        }

        .search-box button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .search-box button:active { transform: translateY(0); }

        .search-box button:disabled {
            background: #c7c9d1;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* --- Status --- */
        .status-message {
            text-align: center;
            padding: 1rem;
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .status-message.error { color: var(--danger); }

        .results-container {
            max-width: 880px;
            margin: 0 auto 3rem;
            padding: 0 1rem;
        }

        /* --- Search result list --- */
        .book-list-item {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            margin-bottom: 0.75rem;
            overflow: hidden;
            cursor: pointer;
            transition: box-shadow 0.25s, transform 0.2s, border-color 0.25s;
            animation: fadeSlideUp 0.4s ease both;
        }

        .book-list-item:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
            border-color: var(--accent-subtle);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-list-inner {
            display: flex;
            gap: 1.25rem;
            padding: 1.25rem;
            align-items: center;
        }

        .book-list-cover { flex-shrink: 0; width: 64px; }

        .book-list-cover img {
            width: 64px;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .book-list-cover .no-cover {
            width: 64px;
            height: 90px;
            background: linear-gradient(135deg, #e0e7ff, #dbeafe);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            color: var(--accent);
            font-size: 0.65rem;
            font-weight: 600;
            text-align: center;
            padding: 0.25rem;
        }

        .book-list-info { flex: 1; min-width: 0; }

        .book-list-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }

        .book-list-author {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }

        .book-list-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-top: 0.5rem;
        }

        .meta-tag {
            background: var(--accent-light);
            color: var(--accent);
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .select-arrow {
            flex-shrink: 0;
            font-size: 1.4rem;
            color: var(--text-muted);
            padding-right: 0.5rem;
            transition: color 0.2s, transform 0.2s;
        }

        .book-list-item:hover .select-arrow {
            color: var(--accent);
            transform: translateX(3px);
        }

        /* --- Detail view --- */
        .detail-view { display: none; }
        .detail-view.active {
            display: block;
            animation: fadeSlideUp 0.35s ease both;
        }

        .back-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .back-btn:hover {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .detail-card-inner {
            display: flex;
            gap: 1.75rem;
            padding: 1.75rem;
        }

        .detail-cover { flex-shrink: 0; width: 150px; }

        .detail-cover img {
            width: 150px;
            height: auto;
            border-radius: var(--radius-sm);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .detail-cover .no-cover {
            width: 150px;
            height: 210px;
            background: linear-gradient(135deg, #e0e7ff, #dbeafe);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            text-align: center;
            padding: 0.5rem;
        }

        .detail-info { flex: 1; min-width: 0; }

        .detail-title {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .detail-author {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.85rem;
        }

        .detail-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 0.85rem;
        }

        .detail-meta .meta-tag {
            font-size: 0.78rem;
            padding: 0.25rem 0.7rem;
        }

        .rating {
            color: var(--warning);
            font-weight: 700;
        }

        .detail-description {
            font-size: 0.94rem;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }

        .detail-description.truncated {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .toggle-desc {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0;
            margin-bottom: 0.5rem;
            font-family: 'Inter', sans-serif;
        }

        .toggle-desc:hover { text-decoration: underline; }

        .external-links {
            margin-top: 0.85rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .external-links a {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
            border: 1px solid var(--border);
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            transition: all 0.2s;
        }

        .external-links a:hover {
            background: var(--accent-light);
            border-color: var(--accent);
        }

        /* --- Pros / Cons --- */
        .pros-cons-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .pros-card, .cons-card {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .pros-card .section-header {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #fff;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.01em;
        }

        .cons-card .section-header {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            color: #fff;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.01em;
        }

        .pros-list, .cons-list {
            list-style: none;
            padding: 0.75rem 1.25rem;
        }

        .pros-list li, .cons-list li {
            padding: 0.65rem 0;
            border-bottom: 1px solid var(--border-light);
            font-size: 0.9rem;
            line-height: 1.55;
            color: var(--text-secondary);
            display: flex;
            gap: 0.6rem;
            align-items: flex-start;
        }

        .pros-list li:last-child, .cons-list li:last-child { border-bottom: none; }

        .pros-list li::before {
            content: '\2713';
            color: var(--success);
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--success-light);
            border-radius: 50%;
            font-size: 0.7rem;
        }

        .cons-list li::before {
            content: '\2717';
            color: var(--danger);
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--danger-light);
            border-radius: 50%;
            font-size: 0.7rem;
        }

        .empty-list-msg {
            padding: 1rem 1.25rem;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-style: italic;
        }

        /* --- AI badge --- */
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.65rem;
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            vertical-align: middle;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        /* --- Reviews section --- */
        .reviews-section {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .reviews-section .section-header {
            background: linear-gradient(135deg, #4338ca, #6366f1);
            color: #fff;
            padding: 0.85rem 1.25rem;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .review-item {
            border-left: 3px solid var(--accent);
            padding: 0.85rem 1.15rem;
            margin: 0.85rem 1.25rem;
            background: var(--accent-light);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        }

        .review-item:last-child { margin-bottom: 1.25rem; }

        .review-author {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .review-rating {
            font-size: 0.85rem;
            color: var(--warning);
            margin-bottom: 0.4rem;
        }

        .review-text {
            font-size: 0.88rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .review-date {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }

        /* --- Spinner --- */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 2rem 1.5rem;
            color: var(--text-muted);
            font-size: 0.82rem;
            border-top: 1px solid var(--border-light);
            margin-top: 1rem;
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        footer a:hover { text-decoration: underline; }

        /* --- Staggered animation for list items --- */
        .book-list-item:nth-child(1) { animation-delay: 0s; }
        .book-list-item:nth-child(2) { animation-delay: 0.05s; }
        .book-list-item:nth-child(3) { animation-delay: 0.1s; }
        .book-list-item:nth-child(4) { animation-delay: 0.15s; }
        .book-list-item:nth-child(5) { animation-delay: 0.2s; }
        .book-list-item:nth-child(6) { animation-delay: 0.25s; }
        .book-list-item:nth-child(7) { animation-delay: 0.3s; }
        .book-list-item:nth-child(8) { animation-delay: 0.35s; }
        .book-list-item:nth-child(9) { animation-delay: 0.4s; }
        .book-list-item:nth-child(10) { animation-delay: 0.45s; }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            header {
                padding: 2.5rem 1.25rem 2rem;
            }

            header h1 { font-size: 1.6rem; }
            header p { font-size: 0.92rem; }

            .api-key-bar { margin-top: -1rem; }

            .search-container { margin-top: 1.25rem; }

            .search-box {
                padding: 4px 4px 4px 14px;
            }

            .search-box input {
                font-size: 0.95rem;
                padding: 0.65rem 0.5rem;
            }

            .search-box button {
                padding: 0.65rem 1.15rem;
                font-size: 0.88rem;
            }

            .pros-cons-container { grid-template-columns: 1fr; }

            .detail-card-inner {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .detail-cover { width: 120px; }
            .detail-cover img { width: 120px; }
            .detail-cover .no-cover { width: 120px; height: 168px; }

            .detail-meta { justify-content: center; }
            .detail-description { text-align: left; }
            .external-links { justify-content: center; }

            .api-key-inner { flex-wrap: wrap; }

            .book-list-inner { padding: 1rem; gap: 1rem; }
        }

        @media (max-width: 380px) {
            header h1 { font-size: 1.35rem; }

            .search-box button {
                padding: 0.6rem 1rem;
                font-size: 0.82rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>Book Review Search</h1>
    <p>Search for a book, select it, and see what readers loved and didn't</p>
</header>

<!-- API Key input -->
<div class="api-key-bar">
    <div class="api-key-inner">
        <label for="apiKeyInput">Claude API Key:</label>
        <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off">
        <span id="keyStatus" class="key-status missing">Not set</span>
    </div>
    <p class="api-key-help">
        Your key is stored only in this browser's localStorage.
        <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Get a key</a>
    </p>
</div>

<div class="search-container">
    <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Enter a book title..." autocomplete="off">
        <button id="searchBtn" onclick="searchBooks()">Search</button>
    </div>
</div>

<div id="status" class="status-message"></div>

<!-- Step 1: search result list -->
<div id="searchResults" class="results-container"></div>

<!-- Step 2: detail + pros/cons view -->
<div id="detailView" class="detail-view results-container"></div>

<footer>
    Powered by <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a>,
    <a href="https://books.google.com" target="_blank" rel="noopener">Google Books</a>,
    and <a href="https://www.anthropic.com" target="_blank" rel="noopener">Claude AI</a>
</footer>

<script>
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const statusEl = document.getElementById('status');
    const searchResultsEl = document.getElementById('searchResults');
    const detailViewEl = document.getElementById('detailView');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const keyStatusEl = document.getElementById('keyStatus');

    let cachedBooks = [];

    /* ===== API Key management ===== */

    const API_KEY_STORAGE = 'claude_api_key';

    function loadApiKey() {
        const saved = localStorage.getItem(API_KEY_STORAGE) || '';
        apiKeyInput.value = saved;
        updateKeyStatus();
    }

    function updateKeyStatus() {
        const key = apiKeyInput.value.trim();
        if (key && key.startsWith('sk-')) {
            keyStatusEl.textContent = 'Saved';
            keyStatusEl.className = 'key-status saved';
        } else {
            keyStatusEl.textContent = key ? 'Invalid format' : 'Not set';
            keyStatusEl.className = 'key-status missing';
        }
    }

    apiKeyInput.addEventListener('input', () => {
        const key = apiKeyInput.value.trim();
        if (key) {
            localStorage.setItem(API_KEY_STORAGE, key);
        } else {
            localStorage.removeItem(API_KEY_STORAGE);
        }
        updateKeyStatus();
    });

    loadApiKey();

    function getApiKey() {
        return apiKeyInput.value.trim();
    }

    /* ===== Utilities ===== */

    searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchBooks();
    });

    function setStatus(msg, isError = false) {
        statusEl.innerHTML = msg;
        statusEl.className = 'status-message' + (isError ? ' error' : '');
    }

    function renderStars(rating) {
        if (!rating) return '';
        const full = Math.floor(rating);
        const half = rating - full >= 0.5 ? 1 : 0;
        const empty = 5 - full - half;
        return '\u2605'.repeat(full) + (half ? '\u00BD' : '') + '\u2606'.repeat(empty) + ' ' + rating.toFixed(1);
    }

    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    /* ===== STEP 1: Search and show book list ===== */

    async function searchBooks() {
        const query = searchInput.value.trim();
        if (!query) {
            setStatus('Please enter a book title.', true);
            return;
        }

        if (!getApiKey()) {
            setStatus('Please enter your Claude API key above first.', true);
            apiKeyInput.focus();
            return;
        }

        searchBtn.disabled = true;
        searchResultsEl.innerHTML = '';
        detailViewEl.innerHTML = '';
        detailViewEl.classList.remove('active');
        setStatus('<span class="spinner"></span> Searching for books...');

        try {
            const [olData, gbData] = await Promise.all([
                fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(query)}&limit=8`)
                    .then(r => r.json()).catch(() => null),
                fetch(`https://www.googleapis.com/books/v1/volumes?q=intitle:${encodeURIComponent(query)}&maxResults=8`)
                    .then(r => r.json()).catch(() => null)
            ]);

            const books = [];
            const seen = new Set();

            if (gbData && gbData.items) {
                for (const item of gbData.items) {
                    const v = item.volumeInfo || {};
                    const key = (v.title || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (seen.has(key)) continue;
                    seen.add(key);
                    books.push({
                        title: v.title || 'Unknown Title',
                        authors: v.authors || [],
                        cover: v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail) : null,
                        description: v.description || '',
                        publishedDate: v.publishedDate || '',
                        categories: v.categories || [],
                        pageCount: v.pageCount || null,
                        rating: v.averageRating || null,
                        ratingsCount: v.ratingsCount || 0,
                        isbn: (v.industryIdentifiers || []).find(i => i.type === 'ISBN_13')?.identifier
                            || (v.industryIdentifiers || []).find(i => i.type === 'ISBN_10')?.identifier || '',
                        previewLink: v.previewLink || '',
                        olKey: '',
                        source: 'google'
                    });
                }
            }

            if (olData && olData.docs) {
                for (const doc of olData.docs) {
                    const key = (doc.title || '').toLowerCase().replace(/[^a-z0-9]/g, '');
                    if (seen.has(key)) continue;
                    seen.add(key);
                    books.push({
                        title: doc.title || 'Unknown Title',
                        authors: doc.author_name || [],
                        cover: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : null,
                        description: '',
                        publishedDate: doc.first_publish_year ? String(doc.first_publish_year) : '',
                        categories: doc.subject ? doc.subject.slice(0, 3) : [],
                        pageCount: doc.number_of_pages_median || null,
                        rating: doc.ratings_average || null,
                        ratingsCount: doc.ratings_count || 0,
                        isbn: (doc.isbn || [])[0] || '',
                        olKey: doc.key || '',
                        previewLink: '',
                        source: 'openlibrary'
                    });
                }
            }

            if (books.length === 0) {
                setStatus('No books found. Try a different search term.', true);
                searchBtn.disabled = false;
                return;
            }

            cachedBooks = books;
            renderSearchResults(books);
            setStatus(`Select the book you're looking for:`);
        } catch (err) {
            console.error(err);
            setStatus('An error occurred while searching. Please try again.', true);
        }

        searchBtn.disabled = false;
    }

    function renderSearchResults(books) {
        searchResultsEl.innerHTML = '';
        books.forEach((book, idx) => {
            const item = document.createElement('div');
            item.className = 'book-list-item';
            item.setAttribute('role', 'button');
            item.setAttribute('tabindex', '0');
            item.onclick = () => selectBook(idx);
            item.onkeydown = (e) => { if (e.key === 'Enter') selectBook(idx); };

            const coverHtml = book.cover
                ? `<img src="${book.cover}" alt="" loading="lazy">`
                : `<div class="no-cover">No Cover</div>`;

            const metaTags = [];
            if (book.publishedDate) metaTags.push(book.publishedDate);
            if (book.authors.length) metaTags.push(book.authors[0]);
            if (book.rating) metaTags.push(`<span class="rating">${renderStars(book.rating)}</span>`);

            item.innerHTML = `
                <div class="book-list-inner">
                    <div class="book-list-cover">${coverHtml}</div>
                    <div class="book-list-info">
                        <div class="book-list-title">${escapeHtml(book.title)}</div>
                        <div class="book-list-author">${book.authors.length ? 'by ' + escapeHtml(book.authors.join(', ')) : ''}</div>
                        <div class="book-list-meta">${metaTags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
                    </div>
                    <div class="select-arrow">&#8250;</div>
                </div>
            `;
            searchResultsEl.appendChild(item);
        });
    }

    /* ===== STEP 2: Select book, fetch reviews, call Claude for Pros/Cons ===== */

    async function selectBook(idx) {
        const book = cachedBooks[idx];
        if (!book) return;

        searchResultsEl.innerHTML = '';
        detailViewEl.classList.add('active');
        detailViewEl.innerHTML = '';
        setStatus('<span class="spinner"></span> Fetching reviews for "' + escapeHtml(book.title) + '"...');

        // Fetch reviews from Open Library / Google Books
        const reviews = await fetchReviews(book);
        book.reviews = reviews;

        setStatus('<span class="spinner"></span> Asking Claude to analyze reviews...');

        // Call Claude API to produce Pros / Cons
        let pros = [];
        let cons = [];
        let aiError = false;

        try {
            const result = await callClaudeForProsCons(book);
            pros = result.pros;
            cons = result.cons;
        } catch (err) {
            console.error('Claude API error:', err);
            aiError = true;
        }

        setStatus('');
        renderDetailView(book, pros, cons, aiError);
    }

    function goBackToResults() {
        detailViewEl.classList.remove('active');
        detailViewEl.innerHTML = '';
        renderSearchResults(cachedBooks);
        setStatus(`Select the book you're looking for:`);
    }

    async function fetchReviews(book) {
        const reviews = [];

        // Resolve Open Library key if we don't have one
        if (!book.olKey && book.isbn) {
            try {
                const isbnRes = await fetch(`https://openlibrary.org/isbn/${book.isbn}.json`);
                const isbnData = await isbnRes.json();
                if (isbnData.works && isbnData.works.length > 0) {
                    book.olKey = isbnData.works[0].key;
                }
            } catch (_) {}
        }

        if (!book.olKey) {
            try {
                const searchRes = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(book.title)}&limit=1`);
                const searchData = await searchRes.json();
                if (searchData.docs && searchData.docs.length > 0) {
                    book.olKey = searchData.docs[0].key;
                    if (!book.rating && searchData.docs[0].ratings_average) {
                        book.rating = searchData.docs[0].ratings_average;
                        book.ratingsCount = searchData.docs[0].ratings_count || 0;
                    }
                }
            } catch (_) {}
        }

        // Open Library work description
        if (book.olKey) {
            try {
                const workRes = await fetch(`https://openlibrary.org${book.olKey}.json`);
                const workData = await workRes.json();
                if (workData.description && !book.description) {
                    book.description = typeof workData.description === 'string'
                        ? workData.description : workData.description.value || '';
                }
            } catch (_) {}

            try {
                const ratingsRes = await fetch(`https://openlibrary.org${book.olKey}/ratings.json`);
                const ratingsData = await ratingsRes.json();
                if (ratingsData.summary && ratingsData.summary.average && !book.rating) {
                    book.rating = ratingsData.summary.average;
                    book.ratingsCount = ratingsData.summary.count || 0;
                }
            } catch (_) {}
        }

        // Google Books ISBN lookup
        if (book.isbn) {
            try {
                const gbRes = await fetch(`https://www.googleapis.com/books/v1/volumes?q=isbn:${book.isbn}&maxResults=1`);
                const gbData = await gbRes.json();
                if (gbData.items && gbData.items.length > 0) {
                    const vol = gbData.items[0].volumeInfo || {};
                    if (vol.averageRating && !book.rating) {
                        book.rating = vol.averageRating;
                        book.ratingsCount = vol.ratingsCount || 0;
                    }
                    if (vol.description && !book.description) {
                        book.description = vol.description;
                    }
                }
            } catch (_) {}
        }

        // Open Library community reviews via reading log API
        if (book.olKey) {
            const workId = book.olKey.replace('/works/', '');
            try {
                const revRes = await fetch(`https://openlibrary.org/works/${workId}/ratings.json`);
                const revData = await revRes.json();
                if (revData.summary && revData.summary.average) {
                    if (!book.rating) {
                        book.rating = revData.summary.average;
                        book.ratingsCount = revData.summary.count || 0;
                    }
                }
                // Breakdown by star count provides useful context for Claude
                if (revData.counts) {
                    book.ratingBreakdown = revData.counts;
                }
            } catch (_) {}

            // Fetch bookshelves data (want-to-read, currently-reading, already-read counts)
            try {
                const shelfRes = await fetch(`https://openlibrary.org/works/${workId}/bookshelves.json`);
                const shelfData = await shelfRes.json();
                if (shelfData.counts) {
                    book.shelves = shelfData.counts;
                }
            } catch (_) {}
        }

        return reviews;
    }

    /* ===== Claude API call for Pros / Cons ===== */

    async function callClaudeForProsCons(book) {
        const apiKey = getApiKey();
        if (!apiKey) throw new Error('No API key');

        // Build context for Claude
        const reviewTexts = (book.reviews || [])
            .map((r, i) => `Review ${i + 1} (by ${r.author}${r.rating ? ', ' + r.rating + '/5' : ''}): ${r.text}`)
            .join('\n\n');

        const bookContext = [
            `Title: ${book.title}`,
            book.authors.length ? `Author(s): ${book.authors.join(', ')}` : '',
            book.publishedDate ? `Published: ${book.publishedDate}` : '',
            book.rating ? `Average rating: ${book.rating}/5 (${book.ratingsCount} ratings)` : '',
            book.ratingBreakdown ? `Rating breakdown: 1-star: ${book.ratingBreakdown['1'] || 0}, 2-star: ${book.ratingBreakdown['2'] || 0}, 3-star: ${book.ratingBreakdown['3'] || 0}, 4-star: ${book.ratingBreakdown['4'] || 0}, 5-star: ${book.ratingBreakdown['5'] || 0}` : '',
            book.shelves ? `Reader shelves: ${book.shelves.want_to_read || 0} want to read, ${book.shelves.currently_reading || 0} currently reading, ${book.shelves.already_read || 0} already read` : '',
            book.categories.length ? `Genres: ${book.categories.join(', ')}` : '',
            book.description ? `Description: ${book.description}` : '',
        ].filter(Boolean).join('\n');

        const userPrompt = `Here is information about a book, along with reader reviews I collected from Open Library and Google Books.

--- BOOK INFO ---
${bookContext}

--- READER REVIEWS ---
${reviewTexts || 'No individual text reviews were found from the APIs, but use the book info, description, rating data, and your knowledge of this book to produce the analysis.'}

Based on ALL available information (the reviews above, the book description, the rating data, and your general knowledge of this book and how it has been received), produce a Pros and Cons list.

- Pros: specific positive attributes readers commonly praise about this book
- Cons: specific criticisms or shortcomings readers commonly mention

Return ONLY valid JSON in this exact format, no other text:
{"pros": ["pro 1", "pro 2", ...], "cons": ["con 1", "con 2", ...]}

Provide 4-8 items per list. Each item should be a concise sentence (under 15 words). Be specific to THIS book, not generic.`;

        const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
                model: 'claude-sonnet-4-5-20250929',
                max_tokens: 1024,
                messages: [
                    { role: 'user', content: userPrompt }
                ]
            })
        });

        if (!response.ok) {
            const errBody = await response.text();
            throw new Error(`API ${response.status}: ${errBody}`);
        }

        const data = await response.json();
        const text = data.content[0].text.trim();

        // Parse JSON from Claude's response (handle markdown code fences if present)
        const jsonStr = text.replace(/^```json?\s*/i, '').replace(/\s*```$/i, '').trim();
        const parsed = JSON.parse(jsonStr);

        return {
            pros: Array.isArray(parsed.pros) ? parsed.pros : [],
            cons: Array.isArray(parsed.cons) ? parsed.cons : []
        };
    }

    /* ===== Render detail view with Pros/Cons ===== */

    function renderDetailView(book, pros, cons, aiError) {
        const coverHtml = book.cover
            ? `<img src="${book.cover}" alt="Cover of ${escapeHtml(book.title)}" loading="lazy">`
            : `<div class="no-cover">No Cover Available</div>`;

        const metaTags = [];
        if (book.publishedDate) metaTags.push(book.publishedDate);
        if (book.pageCount) metaTags.push(`${book.pageCount} pages`);
        if (book.categories.length) metaTags.push(book.categories[0]);
        if (book.rating) metaTags.push(`<span class="rating">${renderStars(book.rating)}</span>`);
        if (book.ratingsCount) metaTags.push(`${book.ratingsCount.toLocaleString()} rating(s)`);

        const descId = 'detail-desc';
        const descHtml = book.description
            ? `<p class="detail-description truncated" id="${descId}">${escapeHtml(book.description)}</p>
               <button class="toggle-desc" onclick="toggleDesc('${descId}', this)">Show more</button>`
            : '';

        const linksHtml = [];
        if (book.previewLink) {
            linksHtml.push(`<a href="${book.previewLink}" target="_blank" rel="noopener">Google Books</a>`);
        }
        if (book.olKey) {
            linksHtml.push(`<a href="https://openlibrary.org${book.olKey}" target="_blank" rel="noopener">Open Library</a>`);
        }
        if (book.isbn) {
            linksHtml.push(`<a href="https://www.goodreads.com/search?q=${book.isbn}" target="_blank" rel="noopener">Goodreads</a>`);
        }

        // Pros/Cons HTML
        let prosConsHtml = '';
        if (aiError) {
            prosConsHtml = `
                <div class="reviews-section" style="margin-bottom:1.5rem;">
                    <div class="section-header">Pros &amp; Cons</div>
                    <div class="empty-list-msg">
                        Could not reach the Claude API. Please check your API key and try again.
                    </div>
                </div>
            `;
        } else {
            const prosHtml = pros.length > 0
                ? `<ul class="pros-list">${pros.map(p => `<li><span>${escapeHtml(p)}</span></li>`).join('')}</ul>`
                : `<div class="empty-list-msg">No specific pros identified.</div>`;

            const consHtml = cons.length > 0
                ? `<ul class="cons-list">${cons.map(c => `<li><span>${escapeHtml(c)}</span></li>`).join('')}</ul>`
                : `<div class="empty-list-msg">No specific cons identified.</div>`;

            prosConsHtml = `
                <div class="pros-cons-container">
                    <div class="pros-card">
                        <div class="section-header">Pros <span class="ai-badge">Claude AI</span></div>
                        ${prosHtml}
                    </div>
                    <div class="cons-card">
                        <div class="section-header">Cons <span class="ai-badge">Claude AI</span></div>
                        ${consHtml}
                    </div>
                </div>
            `;
        }

        // Raw reviews HTML
        let rawReviewsHtml = '';
        if (book.reviews && book.reviews.length > 0) {
            const items = book.reviews.map(r => `
                <div class="review-item">
                    <div class="review-author">${escapeHtml(r.author)} <span style="color:var(--text-muted);font-weight:400;font-size:0.78rem;">(${escapeHtml(r.source)})</span></div>
                    ${r.rating ? `<div class="review-rating">${renderStars(r.rating)}</div>` : ''}
                    <div class="review-text">${escapeHtml(r.text)}</div>
                    ${r.date ? `<div class="review-date">${escapeHtml(r.date)}</div>` : ''}
                </div>
            `).join('');

            rawReviewsHtml = `
                <div class="reviews-section">
                    <div class="section-header">Individual Reviews</div>
                    ${items}
                </div>
            `;
        }

        detailViewEl.innerHTML = `
            <button class="back-btn" onclick="goBackToResults()">&larr; Back to results</button>

            <div class="detail-card">
                <div class="detail-card-inner">
                    <div class="detail-cover">${coverHtml}</div>
                    <div class="detail-info">
                        <div class="detail-title">${escapeHtml(book.title)}</div>
                        <div class="detail-author">${book.authors.length ? 'by ' + escapeHtml(book.authors.join(', ')) : 'Author unknown'}</div>
                        <div class="detail-meta">${metaTags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
                        ${descHtml}
                        <div class="external-links">${linksHtml.join('')}</div>
                    </div>
                </div>
            </div>

            ${prosConsHtml}
            ${rawReviewsHtml}
        `;
    }

    function toggleDesc(id, btn) {
        const el = document.getElementById(id);
        if (el.classList.contains('truncated')) {
            el.classList.remove('truncated');
            btn.textContent = 'Show less';
        } else {
            el.classList.add('truncated');
            btn.textContent = 'Show more';
        }
    }
</script>

</body>
</html>
